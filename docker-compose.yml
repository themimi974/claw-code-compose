services:
  claw-code:
    image: claw-code:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claw-${PROJECT_NAME:-default}
    stdin_open: true
    tty: true
    working_dir: /workspace
    env_file:
      - ../.env
    volumes:
      - ${PROJECT_DIR}:/workspace:Z
    environment:
      - container=
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-dummy}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - CLAW_MODEL=${CLAW_MODEL:-openai/qwen3:14b}
      - ANTHROPIC_SANDBOX=false
    network_mode: host