services:
  claw-code:
    image: claw-code:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claw-${PROJECT_NAME:-default}
    stdin_open: true
    tty: true
    working_dir: /workspace
    env_file:
      - ./.env
    volumes:
      - ../:/workspace:Z
      - ./.claw:/root/.claw:Z
      - ./.claw/settings.json:/root/.config/claw/settings.json:ro
    environment:
      - container=
      - docker=
      - podman=
      - kubernetes_service_host=
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - CLAW_MODEL=${CLAW_MODEL:-}
      - CLAUDE_CODE_AUTO_COMPACT_INPUT_TOKENS=160000
    network_mode: host
